<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SyncWatch | Log In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#dbe1ff",
                        "on-tertiary-container": "#fff1ed",
                        "on-primary-fixed": "#00174b",
                        "on-tertiary-fixed": "#390c00",
                        "inverse-on-surface": "#313030",
                        "surface-tint": "#b4c5ff",
                        "on-secondary-fixed-variant": "#474646",
                        "primary-container": "#0062ff",
                        "surface-bright": "#3a3939",
                        "on-surface-variant": "#c2c6d9",
                        "on-tertiary": "#5c1900",
                        "on-error": "#690005",
                        "surface": "#131313",
                        "outline": "#8c90a2",
                        "on-secondary-container": "#bab8b7",
                        "background": "#131313",
                        "surface-dim": "#131313",
                        "outline-variant": "#424656",
                        "on-tertiary-fixed-variant": "#832700",
                        "inverse-surface": "#e5e2e1",
                        "on-background": "#e5e2e1",
                        "inverse-primary": "#0053da",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#353534",
                        "on-secondary": "#313030",
                        "primary-fixed-dim": "#b4c5ff",
                        "tertiary-container": "#c84000",
                        "surface-variant": "#353534",
                        "on-surface": "#e5e2e1",
                        "error": "#ffb4ab",
                        "surface-container-high": "#2a2a2a",
                        "tertiary-fixed-dim": "#ffb59c",
                        "on-primary-container": "#f3f3ff",
                        "error-container": "#93000a",
                        "surface-container-low": "#1c1b1b",
                        "on-secondary-fixed": "#1c1b1b",
                        "primary": "#b4c5ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary-fixed-dim": "#c9c6c5",
                        "tertiary": "#ffb59c",
                        "secondary-container": "#4a4949",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed": "#e5e2e1",
                        "secondary": "#c9c6c5",
                        "on-primary": "#002a78",
                        "surface-container": "#201f1f",
                        "tertiary-fixed": "#ffdbcf"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(58, 57, 57, 0.6);
            backdrop-filter: blur(20px);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #0062ff 0%, #0053da 100%);
        }
        .text-glow {
            text-shadow: 0 0 12px rgba(0, 98, 255, 0.3);
        }
    </style>
</head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex items-center justify-center p-6 bg-[#0e0e0e]">
<!-- Background Decorative Elements (The "Celestial" Void) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-1/4 -right-1/4 w-[800px] h-[800px] rounded-full bg-[#0062ff]/5 blur-[120px]"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] rounded-full bg-[#0062ff]/3 blur-[100px]"></div>
</div>
<!-- Login Card Container -->
<main class="relative z-10 w-full max-w-[440px]">
<!-- Brand Identity -->
<div class="mb-12 text-center">
<h1 class="font-headline font-black text-4xl tracking-tighter text-[#b4c5ff] mb-2 uppercase italic">SyncWatch</h1>
<p class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant">Synchronized Video Playback</p>
</div>
<!-- Login Card -->
<div class="glass-panel p-10 border border-outline-variant/20 shadow-[0px_24px_48px_rgba(0,0,0,0.4),0px_0px_12px_rgba(0,98,255,0.1)]">
<!-- Form Header -->
<div class="mb-10">
<h2 class="font-headline font-bold text-2xl tracking-tight text-on-surface mb-1">Welcome back</h2>
<p class="font-body text-sm text-on-surface-variant">Enter your credentials to continue.</p>
</div>
<form class="space-y-8">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-[10px] uppercase tracking-[0.1em] text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">alternate_email</span>
                        Email Address
                    </label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/20 text-on-surface font-body text-sm py-3 px-0 focus:ring-0 focus:border-primary-container transition-all duration-300 placeholder:text-on-secondary-container/50" placeholder="Email" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="font-label text-[10px] uppercase tracking-[0.1em] text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">lock_open</span>
                            Password
                        </label>
</div>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/20 text-on-surface font-body text-sm py-3 px-0 focus:ring-0 focus:border-primary-container transition-all duration-300 placeholder:text-on-secondary-container/50" placeholder="Password" type="password"/>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="primary-gradient w-full py-4 text-on-primary-container font-label font-extrabold text-xs uppercase tracking-[0.15em] transition-all duration-300 hover:shadow-[0_0_20px_rgba(0,98,255,0.4)] active:scale-[0.98] flex items-center justify-center gap-3 group" type="submit">
                        Log in
                        <span class="material-symbols-outlined text-sm transition-transform group-hover:translate-x-1">arrow_forward_ios</span>
</button>
</div>
</form>
</div>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body text-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary-fixed font-bold hover:text-white transition-colors ml-1" href="/register">Register</a>
</p>
</div>
</main>
</body></html>
