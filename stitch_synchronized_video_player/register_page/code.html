<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#201f1f",
                        "on-error": "#690005",
                        "background": "#131313",
                        "on-background": "#e5e2e1",
                        "primary-container": "#4d8eff",
                        "on-secondary": "#182f59",
                        "surface": "#131313",
                        "outline-variant": "#424754",
                        "on-primary": "#002e6a",
                        "primary-fixed-dim": "#adc6ff",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#001a42",
                        "secondary-fixed": "#d8e2ff",
                        "inverse-primary": "#005ac2",
                        "secondary-container": "#304671",
                        "outline": "#8c909f",
                        "surface-variant": "#353534",
                        "on-tertiary-fixed": "#311400",
                        "surface-container-highest": "#353534",
                        "tertiary-container": "#df7412",
                        "tertiary-fixed": "#ffdcc6",
                        "primary": "#adc6ff",
                        "inverse-on-surface": "#313030",
                        "secondary": "#b1c6f9",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary-fixed": "#001a42",
                        "inverse-surface": "#e5e2e1",
                        "primary-fixed": "#d8e2ff",
                        "surface-bright": "#3a3939",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-primary-fixed-variant": "#004395",
                        "secondary-fixed-dim": "#b1c6f9",
                        "on-secondary-container": "#9fb5e7",
                        "on-primary-container": "#00285d",
                        "surface-dim": "#131313",
                        "surface-tint": "#adc6ff",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-tertiary-container": "#461f00",
                        "on-tertiary": "#502400",
                        "error-container": "#93000a",
                        "surface-container-high": "#2a2a2a",
                        "on-secondary-fixed-variant": "#304671",
                        "surface-container-low": "#1c1b1b",
                        "tertiary": "#ffb786",
                        "on-surface": "#e5e2e1",
                        "on-surface-variant": "#c2c6d6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131313;
        }
        .digital-obsidian-glow {
            box-shadow: 0 0 40px 0 rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-center items-center">
<main class="w-full max-w-[1920px] px-6 py-12 flex flex-col items-center justify-center grow">
<div class="w-full max-w-md bg-surface-container-low p-10 rounded-xl digital-obsidian-glow border border-white/5">
<header class="mb-10 text-center">
<h1 class="text-3xl font-black tracking-tighter text-primary uppercase">
                    SyncWatch
                </h1>
<p class="mt-2 text-on-surface-variant font-label text-[10px] uppercase tracking-[0.2em]">
                    Join the Digital Obsidian Cinema
                </p>
</header>
<form class="space-y-6">
<div>
<label class="sr-only" for="username">Username</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-transparent focus:border-primary focus:ring-0 text-on-surface py-4 px-0 placeholder:text-outline placeholder:font-label placeholder:uppercase placeholder:text-[10px] placeholder:tracking-widest transition-all" id="username" name="username" placeholder="Username" type="text"/>
</div>
<div>
<label class="sr-only" for="email">Email</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-transparent focus:border-primary focus:ring-0 text-on-surface py-4 px-0 placeholder:text-outline placeholder:font-label placeholder:uppercase placeholder:text-[10px] placeholder:tracking-widest transition-all" id="email" name="email" placeholder="Email" type="email"/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-transparent focus:border-primary focus:ring-0 text-on-surface py-4 px-0 placeholder:text-outline placeholder:font-label placeholder:uppercase placeholder:text-[10px] placeholder:tracking-widest transition-all" id="password" name="password" placeholder="Password" type="password"/>
</div>
<div>
<label class="sr-only" for="confirm_password">Confirm password</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-transparent focus:border-primary focus:ring-0 text-on-surface py-4 px-0 placeholder:text-outline placeholder:font-label placeholder:uppercase placeholder:text-[10px] placeholder:tracking-widest transition-all" id="confirm_password" name="confirm_password" placeholder="Confirm password" type="password"/>
</div>
<div class="pt-4">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label font-bold uppercase tracking-widest py-4 rounded-lg transition-all active:scale-95 shadow-[0_4px_12px_rgba(173,198,255,0.2)]" type="submit">
                        Create account
                    </button>
</div>
</form>
<footer class="mt-8 text-center">
<a class="text-on-surface-variant hover:text-primary font-label text-[10px] uppercase tracking-widest transition-colors" href="/login">
                    Already have an account? <span class="text-primary underline underline-offset-4">Log in</span>
</a>
</footer>
</div>
<div class="mt-12 opacity-20 pointer-events-none absolute -z-10 w-full h-full overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/10 rounded-full blur-[120px]"></div>
<img alt="Atmospheric cinematic texture" class="w-full h-full object-cover grayscale brightness-[0.2]" data-alt="deep charcoal textured surface with subtle light reflections and a cinematic monolithic atmosphere in a dark room" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBM9AUl3JUCut2uceP_b4rnOXk_OvNxXnkDalYJ7HoTh4wTfTZmUQ8If1m82yqn3MjG10zqlCNu9fQMV-1QXji0clNsEA-_zkEY7mz0f4-AXA5vCJxeDAcaDHBJFux1Or_5q4t9X0TVoOoNcm11aZM3C-D-R5ueTCLGYn9mjVcV9MxEQxs7zW4Ml_yIuNFMhncV_Vyitr1xZPeRtZFtW7jC211MsP6iJpShUKI3VF10wme8m3Hb5IPo-Xx-ppN17olt7t1KejRLpjTp"/>
</div>
</main>
<div class="fixed bottom-8 text-[10px] text-outline font-label uppercase tracking-[0.3em] opacity-40">
        © 2024 SyncWatch Systems
    </div>
</body></html>
