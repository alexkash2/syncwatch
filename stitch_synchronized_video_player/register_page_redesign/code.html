<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#dbe1ff",
                        "on-tertiary-container": "#fff1ed",
                        "on-primary-fixed": "#00174b",
                        "on-tertiary-fixed": "#390c00",
                        "inverse-on-surface": "#313030",
                        "surface-tint": "#b4c5ff",
                        "on-secondary-fixed-variant": "#474646",
                        "primary-container": "#0062ff",
                        "surface-bright": "#3a3939",
                        "on-surface-variant": "#c2c6d9",
                        "on-tertiary": "#5c1900",
                        "on-error": "#690005",
                        "surface": "#131313",
                        "outline": "#8c90a2",
                        "on-secondary-container": "#bab8b7",
                        "background": "#131313",
                        "surface-dim": "#131313",
                        "outline-variant": "#424656",
                        "on-tertiary-fixed-variant": "#832700",
                        "inverse-surface": "#e5e2e1",
                        "on-background": "#e5e2e1",
                        "inverse-primary": "#0053da",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#353534",
                        "on-secondary": "#313030",
                        "primary-fixed-dim": "#b4c5ff",
                        "tertiary-container": "#c84000",
                        "surface-variant": "#353534",
                        "on-surface": "#e5e2e1",
                        "error": "#ffb4ab",
                        "surface-container-high": "#2a2a2a",
                        "tertiary-fixed-dim": "#ffb59c",
                        "on-primary-container": "#f3f3ff",
                        "error-container": "#93000a",
                        "surface-container-low": "#1c1b1b",
                        "on-secondary-fixed": "#1c1b1b",
                        "primary": "#b4c5ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary-fixed-dim": "#c9c6c5",
                        "tertiary": "#ffb59c",
                        "secondary-container": "#4a4949",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed": "#e5e2e1",
                        "secondary": "#c9c6c5",
                        "on-primary": "#002a78",
                        "surface-container": "#201f1f",
                        "tertiary-fixed": "#ffdbcf"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-headline {
            letter-spacing: -0.02em;
        }
        .technical-label {
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<!-- Background Cinematic Texture -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,_#1c1b1b_0%,_#131313_100%)]"></div>
<div class="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-10 pointer-events-none"></div>
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] bg-primary-container/5 blur-[120px] rounded-full"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[480px]">
<!-- Brand Identity Header -->
<header class="mb-12 text-center">
<h1 class="text-[#b4c5ff] text-4xl font-black tracking-tighter mb-2">SyncWatch</h1>
<p class="font-label technical-label uppercase text-[10px] text-on-surface-variant">Synchronized Video Playback</p>
</header>
<!-- Registration Card -->
<section class="bg-surface-container/60 backdrop-blur-2xl p-10 shadow-[0px_24px_48px_rgba(0,0,0,0.4),0px_0px_12px_rgba(0,98,255,0.1)] border border-outline-variant/10">
<div class="mb-8">
<h2 class="font-headline editorial-headline text-2xl font-bold text-on-surface mb-1">Create Account</h2>
<p class="text-on-surface-variant text-sm">Join SyncWatch to watch together with friends</p>
</div>
<form class="space-y-6">
<!-- Username Field -->
<div class="space-y-1.5">
<label class="font-label technical-label uppercase text-[10px] text-on-surface-variant block" for="username">Username</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/20 focus:border-primary-container focus:ring-0 text-on-surface placeholder:text-on-surface-variant/30 py-3 px-0 transition-colors" id="username" placeholder="Enzo_Ferrari" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-1.5">
<label class="font-label technical-label uppercase text-[10px] text-on-surface-variant block" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/20 focus:border-primary-container focus:ring-0 text-on-surface placeholder:text-on-surface-variant/30 py-3 px-0 transition-colors" id="email" placeholder="editor@deepspace.io" type="email"/>
</div>
</div>
<!-- Password Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-1.5">
<label class="font-label technical-label uppercase text-[10px] text-on-surface-variant block" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/20 focus:border-primary-container focus:ring-0 text-on-surface placeholder:text-on-surface-variant/30 py-3 px-0 transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-1.5">
<label class="font-label technical-label uppercase text-[10px] text-on-surface-variant block" for="confirm_password">Confirm</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/20 focus:border-primary-container focus:ring-0 text-on-surface placeholder:text-on-surface-variant/30 py-3 px-0 transition-colors" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- CTA Button -->
<div class="pt-4">
<button class="w-full bg-gradient-to-br from-primary-container to-inverse-primary text-on-primary-container py-4 font-label technical-label uppercase text-xs font-bold rounded-lg hover:shadow-[0_0_20px_rgba(0,98,255,0.4)] active:scale-[0.98] transition-all duration-300" type="submit">
                        Create account
                    </button>
</div>
</form>
<!-- Bottom Action -->
<footer class="mt-8 pt-8 border-t border-outline-variant/10 text-center">
<p class="text-on-surface-variant text-sm">
                    Already have an account? 
                    <a class="text-primary hover:text-on-primary-fixed-variant transition-colors ml-1 font-bold" href="/login">Log in</a>
</p>
</footer>
</section>
</main>
</body></html>
