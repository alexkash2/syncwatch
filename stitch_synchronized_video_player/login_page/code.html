<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SyncWatch - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;700;900&amp;display=swap" rel="stylesheet"/>

                        "on-tertiary-fixed": "#311400",
                        "surface-container-highest": "#353534",
                        "tertiary-container": "#df7412",
                        "tertiary-fixed": "#ffdcc6",
                        "primary": "#adc6ff",
                        "inverse-on-surface": "#313030",
                        "secondary": "#b1c6f9",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary-fixed": "#001a42",
                        "inverse-surface": "#e5e2e1",
                        "primary-fixed": "#d8e2ff",

                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-primary-fixed-variant": "#004395",
                        "secondary-fixed-dim": "#b1c6f9",

                        "surface-tint": "#adc6ff",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-tertiary-container": "#461f00",
                        "on-tertiary": "#502400",
                        "error-container": "#93000a",
                        "surface-container-high": "#2a2a2a",
                        "on-secondary-fixed-variant": "#304671",
                        "surface-container-low": "#1c1b1b",
                        "tertiary": "#ffb786",
                        "on-surface": "#e5e2e1",

                    "borderRadius": {
                        "DEFAULT": "0.125rem",

                        "headline": ["Inter"],
                        "body": ["Inter"],

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f0f; /* Overriding for specific requested background */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ghost-border {
            border: 1px solid rgba(140, 144, 159, 0.15);
        }
        .cinematic-glow {
            box-shadow: 0 0 40px 0 rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-on-surface p-6">
<!-- Login Container -->
<main class="w-full max-w-md bg-[#1a1a1a] rounded-xl cinematic-glow overflow-hidden">
<!-- Branding Header -->
<div class="px-10 pt-12 pb-8 flex flex-col items-center">
<h1 class="text-3xl font-black tracking-tighter text-blue-400 mb-2">SyncWatch</h1>
<p class="font-label uppercase tracking-widest text-[10px] text-on-surface-variant opacity-60">Digital Obsidian Cinema</p>
</div>
<!-- Login Form -->
<div class="px-10 pb-12">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label uppercase tracking-widest text-[10px] text-blue-400 font-bold" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none focus:ring-0 focus:border-b focus:border-primary text-on-surface py-3 px-4 rounded-lg placeholder:text-on-surface-variant/30 transition-all" id="email" name="email" placeholder="Email" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block font-label uppercase tracking-widest text-[10px] text-blue-400 font-bold" for="password">Security Key</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none focus:ring-0 focus:border-b focus:border-primary text-on-surface py-3 px-4 rounded-lg placeholder:text-on-surface-variant/30 transition-all" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary-container font-bold py-4 rounded-lg uppercase tracking-widest text-xs hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Log in
                        <span class="material-symbols-outlined text-sm">login</span>
</button>
</div>
</form>
<!-- Registration Footer -->
<div class="mt-10 text-center">
<p class="text-sm text-on-surface-variant/60">
                    Don't have an account? 
                    <a class="text-blue-400 font-bold hover:text-blue-300 transition-colors ml-1" href="/register">Register</a>
</p>
</div>
</div>
<!-- Aesthetic Footer Motif -->
<div class="h-1 w-full bg-gradient-to-r from-transparent via-blue-500/20 to-transparent"></div>
</main>
<!-- Background Decorative Element (Dark Obsidian Theme) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-blue-900/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-[600px] h-[600px] bg-surface-container/20 rounded-full blur-[100px]"></div>
</div>
<!-- Image Logic for Visual Context (Decorative) -->
<div class="hidden">
<img alt="" data-alt="smooth gradient flowing from deep charcoal to pitch black with extremely subtle film grain texture and soft blue atmospheric glow in the corner" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAfZdiwNZ_QbVnI2xiB9Z00nEPujhIPQW2nSvNVWf38LRJnr87pSPWbgB85TtA1dGQI5-CgKRx7IfqX6tTDqEjuB8mQmS04JXknOjED55FQTyQiXpc4wOhGX4XncCUQsc_z7owlHdnNClbYHJ7AbLjfL7lmk1sSrMKpNHApPA-cnv13HpEyhYchXMbyzTx1BTmJb4tF24fsxZHOYhZd-joMxKQiCoqCw5acCLxeBmSifd2fwHvf7A-626vQeixjbhJl-Htq9lkwdzt"/>
</div>
</body></html>
